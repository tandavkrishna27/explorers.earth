server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Dynamic sitemap served by tunes backend (proxied via Docker internal network)
    location = /sitemap.xml {
        proxy_pass http://tunes-app:5000/api/explorers-sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Twitch API for IGDB authentication
    location /twitch-api/ {
        proxy_pass https://id.twitch.tv/;
        proxy_ssl_server_name on;
        proxy_set_header Host id.twitch.tv;
    }

    # Proxy IGDB API
    location /igdb-api/ {
        proxy_pass https://api.igdb.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.igdb.com;
    }

    # Proxy specific scraper endpoints to tunes-app backend
    location /api/apps/scrape-url {
        proxy_pass http://tunes-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/products/scrape-link {
        proxy_pass http://tunes-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/people/scrape-profile {
        proxy_pass http://tunes-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/proxy-image {
        proxy_pass http://tunes-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy other API routes to Strapi backend (api.localqr.earth)
    location /api/ {
        proxy_pass https://api.localqr.earth;
        proxy_ssl_server_name on;
        proxy_set_header Host api.localqr.earth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Proxy Strapi GraphQL API directly
    location /graphql {
        proxy_pass https://api.localqr.earth;
        proxy_ssl_server_name on;
        proxy_set_header Host api.localqr.earth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache Vite-hashed static assets aggressively (they have content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any route not matching a real file serves index.html
    # This is essential for React Router to handle client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
