server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /runtime-web/headers.conf;
    location = /runtime-config.json { alias /runtime-web/runtime-config.json; default_type application/json; include /runtime-web/headers.conf; add_header Cache-Control "no-store" always; }
    location = /index.html { alias /runtime-web/index.html; include /runtime-web/headers.conf; add_header Cache-Control "no-store" always; }
    location = /robots.txt { alias /runtime-web/robots.txt; default_type text/plain; include /runtime-web/headers.conf; add_header Cache-Control "no-store" always; }
    location = /sitemap.xml { alias /runtime-web/sitemap.xml; default_type application/xml; include /runtime-web/headers.conf; add_header Cache-Control "no-store" always; }
    location ^~ /api { return 503; }
    location ^~ /socket.io { return 503; }
    location = /graphql { return 503; }
    location /assets/ { try_files $uri =404; include /runtime-web/headers.conf; add_header Cache-Control "public,max-age=31536000,immutable" always; }
    location / { try_files $uri /index.html; }
}
