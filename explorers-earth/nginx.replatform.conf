server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; media-src 'self' blob: http://127.0.0.1:* http://localhost:*" always;

    # Canonical liveness. Without this exact location the path matches no
    # location, falls through to `try_files ... /index.html` and answers 200 with
    # the SPA shell, which is the `ingress-html-shell` ingress failure.
    location = /health/live {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
    }

    # Canonical Better Auth. Deliberately does NOT inject an Origin header: the
    # canonical origin guard refuses a non-GET whose Origin is not the configured
    # baseURL, and synthesising `$scheme://$http_host` here would launder every
    # cross-origin write into a trusted one.
    location = /api/auth {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical owner surfaces. These previously fell to `location /api/` and were
    # proxied to the Strapi fixture, which serves nothing under this prefix.
    location ^~ /api/explorers/v1/ {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser authentication and authoritative Explorer account reads follow
    # the same branch-local Strapi fixture route as the real application. The
    # end-to-end journey deliberately does not intercept either endpoint.
    location = /api/users/me {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /graphql {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The edge gateway is the only fixture container with a host-facing port.
    # All application routes below terminate on internal-only services.
    location /api/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
    }


    # Public profile reads. The canonical app mounts them
    # (setupExplorersPublicProfileRoutes); they were kept on Strapi only while the
    # retired `combined` delegate carved this prefix out. Browser credentials are
    # stripped: a public read must never depend on who is asking.
    location ^~ /api/explorers/v1/profiles/ {
        proxy_pass http://tunes:5000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical analytics ingress and owner summary (setupCanonicalAnalyticsRoutes).
    # No synthesised Origin header, as for every canonical route.
    location ^~ /api/explorers/analytics/ {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
