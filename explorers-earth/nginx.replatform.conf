server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; media-src 'self' blob: http://127.0.0.1:* http://localhost:*" always;

    location = /api/music-fixture/readiness {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
    }

    # Browser authentication and authoritative Explorer account reads follow
    # the same branch-local Strapi fixture route as the real application. The
    # end-to-end journey deliberately does not intercept either endpoint.
    location = /api/users/me {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /graphql {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The edge gateway is the only fixture container with a host-facing port.
    # All application routes below terminate on internal-only services.
    location /api/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
    }

    location /itunes-api {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
    }

    # Public profile reads use the current REST gateway boundary. The fixture
    # owns the Strapi projection and keeps this route on the private fixture
    # network; no hosted service or browser-supplied credential is involved.
    location ^~ /api/explorers/v1/profiles/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO uses the same fixed Explorer browser origin as the HTTP Music
    # surface.  This narrow prefix preserves the /ws path and handshake query
    # for both WebSocket upgrades and long-polling fallback.
    location ~ ^/ws/?$ {
        proxy_pass http://tunes:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The current native auth, analytics, lifecycle, and Music handlers all
    # live in Tunes; only the fixed legacy Strapi paths use the fallback.
    location ~ ^/(api/(?:login|register|logout|check|csrf-token)(?:/|$)|api/user/(?:request-reactivation|reactivate)(?:/|$)|api/explorers/analytics(?:/|$)|api/music(?:/|$)|api/playlists(?:/|$)|api/playlist(?:/|$)|api/youtube(?:/|$)) {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
