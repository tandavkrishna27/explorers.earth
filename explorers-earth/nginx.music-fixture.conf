server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/music-fixture/readiness {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
    }

    # Browser authentication and authoritative Explorer account reads follow
    # the same branch-local Strapi fixture route as the real application. The
    # end-to-end journey deliberately does not intercept either endpoint.
    location = /api/users/me {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /graphql {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public profile reads use the current REST gateway boundary. The fixture
    # owns the Strapi projection and keeps this route on the private fixture
    # network; no hosted service or browser-supplied credential is involved.
    location ^~ /api/explorers/v1/profiles/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO uses the same fixed Explorer browser origin as the HTTP Music
    # surface.  This narrow prefix preserves the /ws path and handshake query
    # for both WebSocket upgrades and long-polling fallback.
    location ~ ^/ws/?$ {
        proxy_pass http://tunes:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep Explorer's Strapi routes local to the SPA fixture while forwarding
    # only the canonical Music surface to the branch-local Tunes fixture.
    # The browser origin remains http://localhost:55173, which is the sole
    # origin accepted by the fixture Tunes service for credentialed writes.
    location ~ ^/(api/music(?:/|$)|api/playlists(?:/|$)|api/playlist(?:/|$)|api/youtube(?:/|$)) {
        proxy_pass http://tunes:5000;
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
