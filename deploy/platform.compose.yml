        "runtime-web:/runtime-web"
      ],
      "network_mode": "none",
      "restart": "no"
    },
    "web": {
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "CHOWN",
        "SETUID",
        "SETGID",
        "NET_BIND_SERVICE"
      ],
      "image": "ghcr.io/tandavkrishna27/explorers-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
      "volumes": [
        "runtime-web:/runtime-web:ro"
      ],
      "networks": [
        "web"
      ],
      "depends_on": {
        "render": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 20
      },
      "restart": "unless-stopped"
    },
    "proxy": {
      "image": "traefik:v3.1@sha256:8516638b18e67e999d293e4ff0e5baf7807674cd4bdd3d36d448497bcbf0a174",
      "command": [
        "--api.dashboard=false",
        "--providers.file.filename=/routing/platform-routing.yml",
        "--entrypoints.websecure.address=:443"
      ],
      "ports": [
        "127.0.0.1:0:443"
      ],
      "volumes": [
        "/owned/routing.yml:/routing/platform-routing.yml:ro",
        "/owned/tls:/tls:ro"
      ],
      "networks": [
        "api",
        "web"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        },
        "web": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    }
  },
  "networks": {
    "database": {
      "internal": true
    },
    "api": {},
    "web": {
      "internal": true
    }
  },
  "volumes": {
    "postgres-data": {},
    "gate-evidence": {},
    "runtime-web": {}
  }
