# Host nginx site for explorers.earth on the canonical stack (P2 Task 4).
#
# Written fresh from the P2 design; the live host's `nginx -T` was not captured
# (no production access when this was written). Diff it against the live config
# before the first deploy.
#
# ---------------------------------------------------------------------------
# HOST PARAMETERS. This file is a template: deploy/nginx/render-site.sh replaces
# each @NAME@ token below and refuses to write output if any token survives.
# The deploy workflow takes the values from repository variables of the same name.
#
#   @EXPLORERS_SERVER_NAME@           the ONE public hostname, e.g. explorers.earth.
#                                     Must equal the host part of public.json's
#                                     `origin` byte for byte. The other of www/apex
#                                     must 301 to it (owner decision, not here yet).
#   @EXPLORERS_TLS_CERTIFICATE@       absolute path to the full-chain PEM,
#                                     e.g. /etc/letsencrypt/live/<name>/fullchain.pem
#   @EXPLORERS_TLS_CERTIFICATE_KEY@   absolute path to its private key,
#                                     e.g. /etc/letsencrypt/live/<name>/privkey.pem
# ---------------------------------------------------------------------------
#
# Host layout this file assumes (shared with the deploy workflow):
#   /srv/explorers/releases/<git-sha>/dist/              the built SPA + rendered runtime files
#   /srv/explorers/releases/<git-sha>/runtime/headers.conf
#   /srv/explorers/current -> releases/<git-sha>         swapped atomically with `ln -sfn`
# headers.conf lives OUTSIDE the served root, so it can never be downloaded.
#
# Rules this file keeps, and why:
#   - add_header REPLACES the inherited set; it does not merge. Every location that
#     declares its own add_header must include headers.conf again, or it ships with
#     no CSP. Locations without add_header inherit the server-scope include.
#   - No regex locations. Every API prefix uses ^~ so nothing can fall through.
#   - Every API upstream is 127.0.0.1:5000. A container name in proxy_pass is
#     resolved once at startup; host nginx is on no Docker network, so it would
#     refuse to start (`host not found in upstream`) and take the SPA down with it.

server {
    listen 80;
    server_name @EXPLORERS_SERVER_NAME@;
    return 301 https://@EXPLORERS_SERVER_NAME@$request_uri;
}

server {
    # `listen ... http2` rather than `http2 on;`: the host's nginx version is not
    # known, and `http2 on` is an unknown directive before 1.25.1. IPv4 only for the
    # same reason; add `[::]` listens once the host is known to have IPv6.
    listen 443 ssl http2;
    server_name @EXPLORERS_SERVER_NAME@;

    ssl_certificate     @EXPLORERS_TLS_CERTIFICATE@;
    ssl_certificate_key @EXPLORERS_TLS_CERTIFICATE_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/explorers/current/dist;

    # The API accepts 10mb raw media bodies (explorersMediaRoutes.ts). Lower than
    # that and uploads 413 at the proxy where the application never sees them.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    include /srv/explorers/current/runtime/headers.conf;

    # Inherited by every proxying location that sets no proxy_set_header of its own.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Runtime files: never cached, or a symlink swap serves an old shell
    # --- pointing at the previous build's hashed assets.
    location = /index.html {
        include /srv/explorers/current/runtime/headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /runtime-config.json {
        default_type application/json;
        include /srv/explorers/current/runtime/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- The canonical API. ---
    location ^~ /api {
        proxy_pass http://127.0.0.1:5000;
    }
    location = /graphql {
        proxy_pass http://127.0.0.1:5000;
    }
    # Canonical mode starts no socket listener; proxying means the API answers
    # its JSON 404 instead of the SPA shell answering 200.
    location ^~ /socket.io {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Without these, both match `location /` and answer 200 with index.html -
    # a health check that passes while the API is dead.
    location = /health/live {
        proxy_pass http://127.0.0.1:5000;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:5000;
    }
    # The API's sitemap enumerates public profiles; the rendered static one cannot.
    # So the API wins for both, and the rendered copies in dist/ are never served.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000;
    }

    # The four legacy scraper paths. The old container config sent them to
    # `tunes-app:5000`, a name that exists in no compose file. ^~ /api already
    # covers them; they are named so nobody re-adds the container upstream. The
    # canonical API answers them 410 (musicRetirementPolicy.ts prefix tombstones).
    location ^~ /api/apps/scrape-url {
        proxy_pass http://127.0.0.1:5000;
    }
    location ^~ /api/products/scrape-link {
        proxy_pass http://127.0.0.1:5000;
    }
    location ^~ /api/people/scrape-profile {
        proxy_pass http://127.0.0.1:5000;
    }
    location ^~ /api/proxy-image {
        proxy_pass http://127.0.0.1:5000;
    }

    # --- Public upstreams, carried forward from the container config. Their
    # --- hostnames are public DNS, so startup resolution is safe.
    location /twitch-api/ {
        proxy_pass https://id.twitch.tv/;
        proxy_ssl_server_name on;
        proxy_set_header Host id.twitch.tv;
    }
    location /igdb-api/ {
        proxy_pass https://api.igdb.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.igdb.com;
    }

    # --- The SPA. ---
    # headers.conf is outside the root, so it is never served; without this the
    # fallback answers 200 with the shell, and P2 Task 10's check expects a 404.
    location = /headers.conf {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        include /srv/explorers/current/runtime/headers.conf;
        add_header Cache-Control "public,max-age=31536000,immutable" always;
    }
    location / {
        try_files $uri /index.html;
    }
}
