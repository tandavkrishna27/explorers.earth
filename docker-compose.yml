# docker-compose.yml
# Root-level orchestration for the explorers.earth monorepo on Hetzner.
#
# Services:
#   traefik   - Reverse proxy with automatic Let's Encrypt TLS
#   db        - PostgreSQL 15 (internal only, not internet-exposed)
#   tunes     - Node.js/Express + React SPA (localtunes.earth)
#   explorers - Static React SPA served by Nginx (explorers.earth)
#
# Networks:
#   proxy    - Traefik-facing network (traefik + app containers)
#   internal - Private network for DB access (db + tunes only, no internet egress)

version: "3.9"

services:

  # ── Traefik Reverse Proxy + Automatic SSL ──────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # Dashboard disabled in production (enable temporarily for debugging if needed)
      - "--api.dashboard=false"

      # Docker provider — Traefik watches container labels for routing config
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Auto-redirect all HTTP traffic to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # Let's Encrypt via TLS-ALPN-01 challenge (no port 80 config needed)
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket (read-only) so Traefik can watch container events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist Let's Encrypt certificates across container restarts
      - letsencrypt-data:/letsencrypt
    networks:
      - proxy

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: tunes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # ⚠️  NO ports: mapping — the database is ONLY accessible within the
    #     internal Docker network. It is completely unreachable from the internet.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Tunes Application (Node.js + Express + React Frontend) ────────────────
  tunes:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/tunes:${IMAGE_TAG:-latest}
    container_name: tunes-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000

      # Database — connects to the 'db' service via internal Docker DNS
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}

      # Auth & Session
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      # CORS — allow requests from both frontend domains
      ALLOWED_ORIGINS: "https://localtunes.earth,https://explorers.earth"

      # Email (SMTP)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}

      # AWS SES (alternative to SMTP)
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # External APIs
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLARITY_PROJECT_ID: ${CLARITY_PROJECT_ID}

      # Strapi (explorers.earth auth backend)
      STRAPI_URL: ${STRAPI_URL}
      STRAPI_ACCESS_TOKEN: ${STRAPI_ACCESS_TOKEN}
      STRAPI_ANALYTICS_ACCESS_TOKEN: ${STRAPI_ANALYTICS_ACCESS_TOKEN}
      STRAPI_GRAPHQL_ENDPOINT: ${STRAPI_GRAPHQL_ENDPOINT}
      STRAPI_API_KEY: ${STRAPI_API_KEY}

      # Spotify
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}

      # Razorpay (production keys)
      RAZORPAY_KEY_ID_PROD: ${RAZORPAY_KEY_ID_PROD}
      RAZORPAY_KEY_SECRET_PROD: ${RAZORPAY_KEY_SECRET_PROD}
      RAZORPAY_PLAN_ID_MONTHLY_PROD: ${RAZORPAY_PLAN_ID_MONTHLY_PROD}
      RAZORPAY_PLAN_ID_MONTHLY_PRO_PROD: ${RAZORPAY_PLAN_ID_MONTHLY_PRO_PROD}
      RAZORPAY_PLAN_ID_YEARLY_PROD: ${RAZORPAY_PLAN_ID_YEARLY_PROD}
      RAZORPAY_PLAN_ID_YEARLY_PRO_PROD: ${RAZORPAY_PLAN_ID_YEARLY_PRO_PROD}

    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy    # Traefik needs to reach this container
      - internal # Database connection
    labels:
      - "traefik.enable=true"
      # Route all traffic for localtunes.earth to this service
      - "traefik.http.routers.tunes.rule=Host(`localtunes.earth`)"
      - "traefik.http.routers.tunes.entrypoints=websecure"
      - "traefik.http.routers.tunes.tls=true"
      - "traefik.http.routers.tunes.tls.certresolver=letsencrypt"
      # Tell Traefik which internal port to forward to
      - "traefik.http.services.tunes.loadbalancer.server.port=5000"

  # ── Explorers Earth (Static React SPA via Nginx) ──────────────────────────
  explorers:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/explorers-earth:${IMAGE_TAG:-latest}
    container_name: explorers-app
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Route all traffic for explorers.earth to this service
      - "traefik.http.routers.explorers.rule=Host(`explorers.earth`)"
      - "traefik.http.routers.explorers.entrypoints=websecure"
      - "traefik.http.routers.explorers.tls=true"
      - "traefik.http.routers.explorers.tls.certresolver=letsencrypt"
      # Internal Nginx listens on port 80
      - "traefik.http.services.explorers.loadbalancer.server.port=80"

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge
    internal: true  # This network has NO internet egress — DB is isolated

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  letsencrypt-data:
    driver: local
