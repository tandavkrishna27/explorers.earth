name: Deploy tunes to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Code to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          source: "."
          target: "/root/tunes"
          overwrite: true
          rm: true

      - name: Run Docker Compose on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e

            echo "✅ Connected to server"
            cd /root/tunes

            echo "🔁 Recreating .env file"
            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            CLARITY_PROJECT_ID=${{ secrets.CLARITY_PROJECT_ID }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            STRAPI_ACCESS_TOKEN=${{ secrets.STRAPI_ACCESS_TOKEN }}
            STRAPI_GRAPHQL_ENDPOINT=${{ secrets.STRAPI_GRAPHQL_ENDPOINT }}
            STRAPI_API_KEY=${{ secrets.STRAPI_API_KEY }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REFRESH_TOKEN=${{ secrets.SPOTIFY_REFRESH_TOKEN }}
            SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_REST_API_URL=${{ secrets.VITE_REST_API_URL }}
            VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.VITE_PUBLIC_ACCESS_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            echo "🐳 Restarting docker containers..."
            docker compose down
            docker compose up -d --build

            echo "✅ Deployment completed successfully"
