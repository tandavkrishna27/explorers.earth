name: Legacy manual tunes deploy (GHCR)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build tunes image & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "TUNES_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tunes" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push tunes image
        uses: docker/build-push-action@v6
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.TUNES_IMAGE }}:latest
            ${{ env.TUNES_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_REST_API_URL=${{ secrets.VITE_REST_API_URL }}
            VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.VITE_PUBLIC_ACCESS_TOKEN }}
            VITE_CLARITY_PROJECT_ID=${{ secrets.VITE_CLARITY_PROJECT_ID }}
          cache-from: type=gha,scope=tunes
          cache-to: type=gha,mode=max,scope=tunes

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy tunes to Hetzner
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy tunes
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRAPI_ANALYTICS_ACCESS_TOKEN: ${{ secrets.STRAPI_ANALYTICS_ACCESS_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          envs: STRAPI_ANALYTICS_ACCESS_TOKEN
          script: |
            set -e

            test -n "$STRAPI_ANALYTICS_ACCESS_TOKEN"
            export STRAPI_ANALYTICS_ACCESS_TOKEN

            echo "Navigating to app directory..."
            cd /opt/app

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Setting image tag to git SHA: ${{ github.sha }}"
            export IMAGE_TAG=${{ github.sha }}
            export GITHUB_REPOSITORY_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "Pulling new tunes image..."
            docker compose pull tunes

            echo "Restarting tunes container only..."
            docker compose up -d --no-deps tunes

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Deployment complete at $(date)"
