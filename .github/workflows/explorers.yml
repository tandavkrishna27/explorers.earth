name: Deploy explorers.earth (canonical)

# P2 Task 7: the whole application onto the explorers host - SPA, API, database.
#
# DORMANT BY DESIGN. It runs only on a manual dispatch from main, and only when
# `confirm_cutover` is typed exactly; anything else refuses before a secret or an
# SSH connection is touched. The first real run replaces what the explorers host
# serves today.
#
# It builds no image. The API image is the one tunes.yml's publish-image job
# pushed, scanned and attested (auditDeploymentAuthority keeps tunes.yml the single
# build authority); this verifies that attestation for this commit and deploys it
# by digest.
#
# Host layout (shared with deploy/nginx/explorers.conf and deploy/host/explorers-deploy.sh):
#   /srv/explorers/releases/<sha>/{dist,runtime/headers.conf}
#   /srv/explorers/current -> releases/<sha>
#   /opt/explorers/{production.env,production.compose.yml}
#
# All application configuration lives in the explorers-production environment
# (docs/operations/explorers-github-configuration.md). Every deploy renders
# production.env from it, validates it before any SSH connection, and the host
# installs it root-owned 0600, keeping the previous one. Nothing is hand-edited
# on the host; the database password files are generated there and never leave it.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   EXPLORERS_PUBLIC_JSON           the production public.json (P2 Task 5 Step 2)
#   EXPLORERS_SERVER_NAME           the one public hostname; must match public.json's origin
#   EXPLORERS_TLS_CERTIFICATE       full-chain PEM path on the host
#   EXPLORERS_TLS_CERTIFICATE_KEY   private key path on the host
#   EXPLORERS_NGINX_SITE_PATH       the site file nginx includes, under /etc/nginx/
# Secrets:
#   EXPLORERS_DEPLOY_HOST, EXPLORERS_DEPLOY_USER, EXPLORERS_DEPLOY_KEY,
#   EXPLORERS_DEPLOY_KNOWN_HOSTS (pinned host key), optional DEPLOY_PORT.
#   The deploy user needs passwordless sudo.
# explorers-production environment secrets (rendered into production.env):
#   EXPLORERS_AUTH_SECRET, MUSIC_GATE_ATTESTATION_KEY, GOOGLE_CLIENT_SECRET,
#   GOOGLE_BOOKS_API_KEY, TMDB_ACCESS_TOKEN, EXPLORERS_S3_ACCESS_KEY_ID,
#   EXPLORERS_S3_SECRET_ACCESS_KEY
# explorers-production environment variables:
#   GOOGLE_CLIENT_ID, EXPLORERS_MEDIA_S3_BUCKET, EXPLORERS_MEDIA_S3_REGION,
#   EXPLORERS_BACKUP_AGE_RECIPIENT, optional EXPLORERS_TRUSTED_PROXY_IP

on:
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: 'Type "replace-explorers-host" to deploy over the live explorers host. Anything else refuses.'
        required: true
        default: ""
        type: string
      image_digest:
        description: "sha256 digest tunes.yml's publish-image job pushed for this same commit on main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: explorers-production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unless the cutover is explicitly confirmed
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm_cutover }}
          DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::This workflow deploys only on a manual dispatch."; exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Deploy only from main (got $GITHUB_REF)."; exit 1
          fi
          if [[ "$CONFIRM" != "replace-explorers-host" ]]; then
            echo "::error::confirm_cutover was not 'replace-explorers-host'. Nothing was deployed."; exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be a sha256 digest from tunes.yml's publish-image job."; exit 1
          fi

  deploy:
    needs: authorize
    # Repeats the authorize job's checks statically, so this job is unreachable from
    # a push, a PR or a non-main ref even if authorize were edited to pass.
    if: needs.authorize.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_cutover == 'replace-explorers-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Add required reviewers to this environment for a second human gate.
    environment: explorers-production
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PUBLIC_JSON: ${{ vars.EXPLORERS_PUBLIC_JSON }}
      EXPLORERS_SERVER_NAME: ${{ vars.EXPLORERS_SERVER_NAME }}
      EXPLORERS_TLS_CERTIFICATE: ${{ vars.EXPLORERS_TLS_CERTIFICATE }}
      EXPLORERS_TLS_CERTIFICATE_KEY: ${{ vars.EXPLORERS_TLS_CERTIFICATE_KEY }}
      NGINX_SITE_PATH: ${{ vars.EXPLORERS_NGINX_SITE_PATH }}
    steps:
      - name: Require every deploy input before doing any work
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.EXPLORERS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EXPLORERS_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.EXPLORERS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPLORERS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$PUBLIC_JSON" ]]; then
            echo "::error::Repository variable EXPLORERS_PUBLIC_JSON is not set. It is the production public.json the SPA renders from (P2 Task 5 Step 2); without it the SPA shows 'The application configuration is unavailable.'"
            missing=1
          fi
          for name in EXPLORERS_SERVER_NAME EXPLORERS_TLS_CERTIFICATE EXPLORERS_TLS_CERTIFICATE_KEY NGINX_SITE_PATH; do
            if [[ -z "${!name}" ]]; then echo "::error::Repository variable ${name/#NGINX_SITE_PATH/EXPLORERS_NGINX_SITE_PATH} is not set."; missing=1; fi
          done
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then echo "::error::Secret EXPLORERS_$name is not set."; missing=1; fi
          done
          [[ "$missing" == 0 ]]

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Every value reaches the renderer as an environment variable of this step
      # only: never an argument, never echoed, never traced. The renderer and the
      # host's bootstrap check share deploy/host/validate-production-env.sh, and a
      # failure names the variable and the rule, never the value. The S3 keys come
      # from EXPLORERS_S3_* on purpose: the repository-level AWS_* secrets are SES's.
      - name: Render and validate production.env from the explorers-production environment
        shell: bash
        env:
          EXPLORERS_AUTH_SECRET: ${{ secrets.EXPLORERS_AUTH_SECRET }}
          MUSIC_GATE_ATTESTATION_KEY: ${{ secrets.MUSIC_GATE_ATTESTATION_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          EXPLORERS_S3_ACCESS_KEY_ID: ${{ secrets.EXPLORERS_S3_ACCESS_KEY_ID }}
          EXPLORERS_S3_SECRET_ACCESS_KEY: ${{ secrets.EXPLORERS_S3_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          EXPLORERS_MEDIA_S3_BUCKET: ${{ vars.EXPLORERS_MEDIA_S3_BUCKET }}
          EXPLORERS_MEDIA_S3_REGION: ${{ vars.EXPLORERS_MEDIA_S3_REGION }}
          EXPLORERS_BACKUP_AGE_RECIPIENT: ${{ vars.EXPLORERS_BACKUP_AGE_RECIPIENT }}
          EXPLORERS_TRUSTED_PROXY_IP: ${{ vars.EXPLORERS_TRUSTED_PROXY_IP }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/stage"
          bash deploy/render-production-env.sh "$RUNNER_TEMP/stage/production.env"

      - name: Require the production compose file
        run: |
          # deploy/production.compose.yml arrives with PR #129 (P2 Task 3).
          test -f deploy/production.compose.yml || { echo "::error::deploy/production.compose.yml is not on main yet (P2 Task 3)."; exit 1; }

      - name: Check public.json agrees with the nginx server name
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_JSON" > "$RUNNER_TEMP/public.json"
          origin="$(jq -er '.origin' "$RUNNER_TEMP/public.json")" \
            || { echo "::error::EXPLORERS_PUBLIC_JSON is not JSON with an origin."; exit 1; }
          # Five couplings (runtime-config origin check, Better Auth trustedOrigins,
          # the Origin guard, SameSite cookies, root-relative fetches) force one origin.
          if [[ "$origin" != "https://$EXPLORERS_SERVER_NAME" ]]; then
            echo "::error::public.json origin '$origin' is not https://$EXPLORERS_SERVER_NAME."; exit 1
          fi
          echo "Rendering for $origin:"; jq . "$RUNNER_TEMP/public.json"

      - name: Authenticate to GHCR for provenance verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the image is tunes.yml's attested build of this commit
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner}/explorers-tunes"
          # The SPA is built from this checkout, so the API must be the same commit.
          gh attestation verify "oci://${image_name}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/tunes.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: explorers-earth/package-lock.json

      # A platform build inlines no VITE_* variable (vite.platform.config.ts sets
      # envPrefix: []). Everything the browser needs comes from runtime-config.json.
      - name: Build the platform SPA
        working-directory: explorers-earth
        run: |
          npm ci
          npm run landing:check
          npx tsc -b
          npx vite build --config vite.platform.config.ts --mode platform
          node scripts/check-music-production-bundle.mjs

      - name: Assemble the release and render the nginx site
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          test -f "$stage/production.env" || { echo "::error::production.env was not rendered."; exit 1; }
          sh deploy/assemble-release.sh "$RUNNER_TEMP/public.json" explorers-earth/dist "$RUNNER_TEMP/release/$GITHUB_SHA"
          tar -C "$RUNNER_TEMP/release" -czf "$stage/release.tar.gz" "$GITHUB_SHA"
          sh deploy/nginx/render-site.sh deploy/nginx/explorers.conf "$stage/explorers.conf"
          cp deploy/production.compose.yml "$stage/production.compose.yml"
          cp deploy/host/explorers-deploy.sh "$stage/explorers-deploy.sh"
          cp tunes/deployment/platform-backup.mjs "$stage/platform-backup.mjs"
          {
            echo "IMAGE_NAME=${{ steps.image.outputs.image_name }}"
            echo "IMAGE_DIGEST=$IMAGE_DIGEST"
            echo "COMMIT=$GITHUB_SHA"
            echo "NGINX_SITE_PATH=$NGINX_SITE_PATH"
            echo "SERVER_NAME=$EXPLORERS_SERVER_NAME"
          } > "$stage/deploy.env"
          echo "--- rendered headers.conf"; cat "$RUNNER_TEMP/release/$GITHUB_SHA/runtime/headers.conf"

      - name: Configure SSH with the pinned host key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.EXPLORERS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EXPLORERS_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.EXPLORERS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPLORERS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/explorers_deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/explorers_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          {
            echo "Host explorers"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_PORT:-22}"
            echo "  IdentityFile $HOME/.ssh/explorers_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload the release
        id: stage
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="/tmp/explorers-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "remote=$remote" >> "$GITHUB_OUTPUT"
          ssh explorers "rm -rf '$remote' && install -d -m 700 '$remote'"
          scp -q "$RUNNER_TEMP"/stage/* "explorers:$remote/"
          # The staging directory is 0700 and production.env is 0600 on both ends;
          # the host installs it as root and shreds this copy (explorers-deploy.sh).
          # The job token is read-only and expires with the job; logged out in the last step.
          printf '%s' "$GHCR_TOKEN" | ssh explorers "sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      # Backup and restore (docs/replatform/release-and-recovery.md): nothing migrates
      # until the database the candidate will migrate has been backed up for exactly
      # this candidate, and a drill has proven a backup at that schema level restores.
      - name: Take a pre-deploy backup on the host
        shell: bash
        run: |
          set -euo pipefail
          remote='${{ steps.stage.outputs.remote }}'
          ssh explorers "sudo bash '$remote/explorers-deploy.sh' backup '$remote'"
          scp -q "explorers:$remote/backup-result" "$RUNNER_TEMP/backup-result"
          if [[ "$(cat "$RUNNER_TEMP/backup-result")" == backed-up ]]; then
            scp -q "explorers:$remote/backup-manifest.json" "$RUNNER_TEMP/backup-manifest.json"
          fi

      - name: Refuse the deploy without recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat "$RUNNER_TEMP/backup-result")"
          if [[ "$result" == fresh ]]; then
            # Decided on the host from its own Docker state, never from an input.
            echo "::notice::The host has no migrated canonical database yet; the first deploy has nothing to back up."
            exit 0
          fi
          [[ "$result" == backed-up ]] || { echo "::error::The host reported no backup result."; exit 1; }
          npm ci --no-audit --no-fund
          npm ci --prefix tunes --no-audit --no-fund --legacy-peer-deps
          marker="$(sed -n 's/^x-migration-marker: &migration-marker //p' deploy/production.compose.yml)"
          npm run --silent platform:recovery-gate -- \
            --manifest "$RUNNER_TEMP/backup-manifest.json" \
            --receipt docs/replatform/evidence/recovery-receipt.json \
            --candidate-digest "$IMAGE_DIGEST" \
            --candidate-commit "$GITHUB_SHA" \
            --candidate-marker "$marker"

      - name: Stage the API
        shell: bash
        run: |
          set -euo pipefail
          ssh explorers "sudo bash '${{ steps.stage.outputs.remote }}/explorers-deploy.sh' stage '${{ steps.stage.outputs.remote }}'"

      # The API is live from here; the SPA is still the previous one. Fail now rather
      # than after the swap.
      - name: API acceptance checks, before the SPA switches
        shell: bash
        run: |
          set -euo pipefail
          ssh -f -N -o ExitOnForwardFailure=yes -L 15000:127.0.0.1:5000 explorers
          # The same file the cutover rehearsal runs on the stand-in host.
          bash deploy/host/api-acceptance.sh http://127.0.0.1:15000 "$EXPLORERS_SERVER_NAME"

      - name: Switch the SPA and the nginx site
        shell: bash
        run: |
          set -euo pipefail
          ssh explorers "sudo bash '${{ steps.stage.outputs.remote }}/explorers-deploy.sh' activate '${{ steps.stage.outputs.remote }}'"

      - name: Log out of GHCR and remove the staging directory
        if: always() && steps.stage.outputs.remote != ''
        shell: bash
        run: |
          ssh explorers "sudo docker logout ghcr.io; rm -rf '${{ steps.stage.outputs.remote }}'" || true
          pkill -f 'ssh -f -N -o ExitOnForwardFailure=yes -L 15000' || true

      - name: Remove the rendered production.env from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/stage/production.env"
