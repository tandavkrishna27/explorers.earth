name: Deploy tunes to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'tunes/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🚀 Upload code (FIXED: no nested folders)
      - name: Upload Code to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          port: 22
          source: "tunes"
          target: "/home/deploy/tunes"
          overwrite: true
          rm: true

      # 🚀 Run deployment
      - name: Run Docker Compose on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          port: 22
          script: |
            set -e

            echo "✅ Connected to server"

            cd /home/deploy/tunes/tunes

            echo "🔁 Recreating .env file"
            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            CLARITY_PROJECT_ID=${{ secrets.CLARITY_PROJECT_ID }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            STRAPI_ACCESS_TOKEN=${{ secrets.STRAPI_ACCESS_TOKEN }}
            STRAPI_ANALYTICS_ACCESS_TOKEN=${{ secrets.STRAPI_ANALYTICS_ACCESS_TOKEN }}
            STRAPI_GRAPHQL_ENDPOINT=${{ secrets.STRAPI_GRAPHQL_ENDPOINT }}
            STRAPI_API_KEY=${{ secrets.STRAPI_API_KEY }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REFRESH_TOKEN=${{ secrets.SPOTIFY_REFRESH_TOKEN }}
            SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}
            RAZORPAY_KEY_ID_DEV=${{ secrets.RAZORPAY_KEY_ID_DEV }}
            RAZORPAY_KEY_SECRET_DEV=${{ secrets.RAZORPAY_KEY_SECRET_DEV }}
            RAZORPAY_PLAN_ID_MONTHLY_DEV=${{ secrets.RAZORPAY_PLAN_ID_MONTHLY_DEV }}
            RAZORPAY_PLAN_ID_MONTHLY_PRO_DEV=${{ secrets.RAZORPAY_PLAN_ID_MONTHLY_PRO_DEV }}
            RAZORPAY_PLAN_ID_YEARLY_DEV=${{ secrets.RAZORPAY_PLAN_ID_YEARLY_DEV }}
            RAZORPAY_PLAN_ID_YEARLY_PRO_DEV=${{ secrets.RAZORPAY_PLAN_ID_YEARLY_PRO_DEV }}
            RAZORPAY_KEY_ID_PROD=${{ secrets.RAZORPAY_KEY_ID_PROD }}
            RAZORPAY_KEY_SECRET_PROD=${{ secrets.RAZORPAY_KEY_SECRET_PROD }}
            RAZORPAY_PLAN_ID_MONTHLY_PROD=${{ secrets.RAZORPAY_PLAN_ID_MONTHLY_PROD }}
            RAZORPAY_PLAN_ID_MONTHLY_PRO_PROD=${{ secrets.RAZORPAY_PLAN_ID_MONTHLY_PRO_PROD }}
            RAZORPAY_PLAN_ID_YEARLY_PROD=${{ secrets.RAZORPAY_PLAN_ID_YEARLY_PROD }}
            RAZORPAY_PLAN_ID_YEARLY_PRO_PROD=${{ secrets.RAZORPAY_PLAN_ID_YEARLY_PRO_PROD }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_REST_API_URL=${{ secrets.VITE_REST_API_URL }}
            VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.VITE_PUBLIC_ACCESS_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            echo "🐳 Restarting docker containers..."

            docker compose down
            docker compose up -d --build

            echo "✅ Deployment completed successfully"
