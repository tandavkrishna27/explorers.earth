name: Base image mirror

# Copies every digest-pinned third-party base image into this repository's GHCR
# namespace so CI pulls never touch public.ecr.aws or Docker Hub anonymously.
# ECR Public throttles and data-caps anonymous pulls per source IP, and hosted
# runners share egress IPs, so platform-fixture and build-test-scan-push failed
# with `429 toomanyrequests` on roughly half of all runs.
#
# The copy is manifest-preserving: a single-source `imagetools create` pushes the
# index unchanged, and the job fails unless every mirrored digest equals the pin.
# Re-running is idempotent. Add an image here before referencing it elsewhere.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/base-image-mirror.yml

permissions:
  contents: read

concurrency:
  group: base-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy pinned images and prove each digest is unchanged
        shell: bash
        run: |
          set -euo pipefail
          mirror=ghcr.io/tandavkrishna27/mirror
          # source-reference  mirror-name:tag  digest
          while read -r source target digest; do
            [ -n "$source" ] || continue
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$mirror/$target" "$source@$digest"; then break; fi
              [ "$attempt" -lt 5 ] || { echo "copy failed: $source@$digest" >&2; exit 1; }
              sleep $((attempt * 20))
            done
            mirrored="$(docker buildx imagetools inspect "$mirror/$target" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "$mirrored" != "$digest" ]; then
              echo "digest drift: $mirror/$target is $mirrored, pinned $digest" >&2
              exit 1
            fi
            docker buildx imagetools inspect "$mirror/$target@$digest" >/dev/null
            echo "mirrored $source@$digest -> $mirror/$target@$mirrored"
          done <<'IMAGES'
          public.ecr.aws/docker/library/node node:24.21.0-alpine sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          public.ecr.aws/docker/library/node node:24.21.0-bookworm-slim sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          public.ecr.aws/docker/library/postgres postgres:15-alpine sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          docker.io/library/postgres postgres:15-alpine-fceb6f86 sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
          public.ecr.aws/docker/library/nginx nginx:1.27-alpine sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          IMAGES
