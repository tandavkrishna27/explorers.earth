name: Base image mirror

# Copies every digest-pinned third-party base image into this repository's GHCR
# namespace so CI pulls never touch public.ecr.aws or Docker Hub anonymously.
# ECR Public throttles and data-caps anonymous pulls per source IP, and hosted
# runners share egress IPs, so platform-fixture and build-test-scan-push failed
# with `429 toomanyrequests` on roughly half of all runs.
#
# The copy is manifest-preserving: a single-source `imagetools create` pushes the
# index unchanged, and the job fails unless every mirrored digest equals the pin.
# Re-running is idempotent. Add an image here before referencing it elsewhere.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/base-image-mirror.yml

permissions:
  contents: read

concurrency:
  group: base-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy pinned images and prove each digest is unchanged
        shell: bash
        run: |
          set -euo pipefail
          mirror=ghcr.io/tandavkrishna27/mirror
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
          # name  mirror-tag  digest. Docker Official Images publish the same index
          # digest on public.ecr.aws and Docker Hub, so either is a valid source; the
          # copy itself is throttled by ECR Public too, hence the fallback and backoff.
          while read -r name tag digest; do
            [ -n "$name" ] || continue
            target="$mirror/$name:$tag"
            if [ "$(digest_of "$target")" = "$digest" ]; then
              echo "already mirrored $target@$digest"
              continue
            fi
            copied=
            for attempt in 1 2 3 4; do
              for source in "public.ecr.aws/docker/library/$name" "docker.io/library/$name"; do
                if docker buildx imagetools create --tag "$target" "$source@$digest"; then copied="$source"; break 2; fi
              done
              if [ "$attempt" -lt 4 ]; then sleep $((attempt * 30)); fi
            done
            [ -n "$copied" ] || { echo "copy failed: $name@$digest" >&2; exit 1; }
            mirrored="$(digest_of "$target")"
            if [ "$mirrored" != "$digest" ]; then
              echo "digest drift: $target is ${mirrored:-unreadable}, pinned $digest" >&2
              exit 1
            fi
            echo "mirrored $copied@$digest -> $target@$mirrored"
          done <<'IMAGES'
          node 24.21.0-alpine sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          node 24.21.0-bookworm-slim sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          postgres 15-alpine sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          postgres 15-alpine-fceb6f86 sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
          nginx 1.27-alpine sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          IMAGES
