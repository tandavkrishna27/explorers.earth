name: Frontend E2E qualification

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      # A real-stack lane owns a PostgreSQL container and builds the frontend, so
      # proving one costs far less than running thirteen. The schedule always runs
      # everything; this only narrows a manual dispatch.
      #
      # The filter is applied per step, because a job-level `if` cannot see matrix.lane,
      # so a lane this input excludes still reports success with its work skipped. A
      # filtered dispatch is therefore evidence about the selected lane only - read the
      # unfiltered scheduled run, or the individual job's steps, for anything else.
      lane:
        description: "Single lane to run, or all"
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-e2e-qualification-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: explorers-earth

jobs:
  browser-matrix:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: category-navigation, command: "npx playwright test --config=playwright.category-navigation.config.ts" }
          - { lane: public-shell-cross-browser, command: "npx playwright test --config=playwright.public-shell-continuity.config.ts" }
          - { lane: public-category-themes, command: "npx playwright test --config=playwright.public-category-themes.config.ts" }
          - { lane: public-theme-alignment, command: "npx playwright test --config=playwright.public-theme-alignment.config.ts" }
          - { lane: category-theme-alignment, command: "npx playwright test --config=playwright.category-theme-alignment.config.ts" }
          - { lane: music-publishing, command: "npx playwright test --config=playwright.music-publishing.config.ts" }
          - { lane: music-presentation, command: "npx playwright test --config=playwright.music-presentation.config.ts" }
          - { lane: music-presentation-cross-browser, command: "npx playwright test --config=playwright.music-presentation-cross-browser.config.ts" }
          - { lane: music-permissions, command: "npx playwright test --config=playwright.music-permissions.config.ts" }
          - { lane: account-lifecycle, command: "npx playwright test --config=playwright.lifecycle.config.ts" }
          - { lane: profile-tabs, command: "npx playwright test --config=playwright.profile-tabs.config.ts" }
          - lane: general-pages
            command: "npx playwright test --config=playwright.general-e2e.config.ts e2e/analytics.spec.ts e2e/books.spec.ts e2e/categories.spec.ts e2e/games.spec.ts e2e/guides.spec.ts e2e/locations.spec.ts e2e/marketing-pages.spec.ts e2e/movies.spec.ts e2e/people.spec.ts e2e/products.spec.ts"
          - lane: remaining-contained-contracts
            command: "npx playwright test e2e/music.spec.ts e2e/music-accessibility.spec.ts e2e/music-auth-triggers.spec.ts e2e/music-fixture-fullstack.spec.ts e2e/music-fullstack.spec.ts e2e/music-harness-contract.spec.ts e2e/profile-editor-polish.spec.ts e2e/profile-presentation-visual.spec.ts e2e/profile-theme.spec.ts e2e/public-scroll.spec.ts e2e/reactivation-lifecycle.spec.ts --project=chromium-pr-safe --project=firefox-music-visual --project=webkit-music-visual --project=chromium-music-owner-mobile --retries=0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: explorers-earth/package-lock.json
      - run: npm ci
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
      - name: Install Music fixture dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
        run: npm ci --prefix ../tunes --legacy-peer-deps
      - run: npx playwright install --with-deps chromium firefox webkit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
      - name: Run isolated qualification lane
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
        run: ${{ matrix.command }} --reporter=line,json
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../.artifacts/frontend-e2e-${{ matrix.lane }}.json
          VITE_API_URL: http://localhost:5173/graphql
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_PUBLIC_ACCESS_TOKEN: fixture-placeholder
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: https://localtunes.test
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          VITE_PAYMENT_API_URL: http://localhost:5173
          PLAYWRIGHT_PR_SAFE: true
      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-e2e-${{ matrix.lane }}
          path: |
            .artifacts/frontend-e2e-${{ matrix.lane }}.json
            .artifacts/**/results/
            explorers-earth/.artifacts/**/results/
            explorers-earth/test-results/
          retention-days: 14

  # The real-stack replatform suites under explorers-earth/e2e/replatform were run only
  # by hand: every one of them is enumerated in
  # explorers-earth/e2e/replatform/suite-manifest.json, and no workflow referenced any of
  # them. The canonical account lifecycle in particular had no automated browser coverage
  # at all, while the mocked account-lifecycle.spec.ts was the only gated substitute.
  #
  # They are deliberately not in the required set yet. Each one owns a disposable
  # PostgreSQL 15 container and builds the frontend, so they belong here first, where a
  # nightly run and workflow_dispatch can establish whether they hold on a runner before
  # anything merges on them. Promote a lane into the required workflow once it has been
  # observed green here, not before.
  #
  # Their guard refuses an ambient database or a redirected Docker daemon, so this job
  # must not define DATABASE_URL, DATABASE_URL_TEST, DOCKER_HOST or DOCKER_CONTEXT, and
  # the acknowledgement has to be passed verbatim as the only argument.
  replatform-real-stack:
    name: real-stack ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: profile, command: "npm run explorers:test:profile-browser --" }
          - { lane: auth, command: "npm run explorers:test:auth-browser --" }
          - { lane: lifecycle, command: "npm run explorers:test:lifecycle-browser --" }
          - { lane: books, command: "npx tsx scripts/books-browser-fixture.ts" }
          - { lane: movies, command: "npx tsx scripts/movies-browser-fixture.ts" }
          - { lane: games, command: "npx tsx scripts/games-browser-fixture.ts" }
          - { lane: analytics, command: "npx tsx scripts/analytics-browser-fixture.ts" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: explorers-earth/package-lock.json
      - run: npm ci
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
      - name: Install fixture runner dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
        run: npm ci --prefix ../tunes --legacy-peer-deps
      # The fixture drives explorers-earth's own Playwright CLI from that directory, so
      # the browsers have to be installed there rather than under tunes.
      - run: npx playwright install --with-deps chromium
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
      # The fixture attests an exact, already-present image and never pulls one itself -
      # its whole Docker path is read-only apart from `run`. A fresh runner has no
      # postgres:15-alpine, so the attestation fails with "read-only Docker attestation
      # failed", which is the image inspect and not the daemon. Supplying the image is
      # the caller's job, exactly as it is on a developer machine.
      - name: Fetch the pinned fixture PostgreSQL image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane }}
        run: docker pull postgres:15-alpine
      - name: Run owned real-stack lane
        if: ${{ matrix.lane != 'analytics' && (github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane) }}
        working-directory: tunes
        run: ${{ matrix.command }} --ack TASK4_FIXTURE_OWNED_DISPOSABLE_PG15
        env:
          CI: true
      - name: Run owned analytics producer with retained evidence
        if: ${{ matrix.lane == 'analytics' && (github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane) }}
        working-directory: tunes
        run: |
          receipt="$RUNNER_TEMP/replatform-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-analytics/analytics"
          mkdir -p "$receipt"
          npx tsx scripts/analytics-browser-fixture.ts --ack TASK4_FIXTURE_OWNED_DISPOSABLE_PG15 --receipt "$receipt"
        env:
          CI: true
          TMPDIR: ${{ runner.temp }}
      - name: Upload retained analytics producer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.lane == 'analytics' && (github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == matrix.lane) }}
        with:
          name: replatform-analytics-producer-receipt
          path: ${{ runner.temp }}/replatform-e2e-${{ github.run_id }}-${{ github.run_attempt }}-analytics/analytics/qualification.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload real-stack evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: replatform-real-stack-${{ matrix.lane }}
          path: |
            .artifacts/**/results/
            explorers-earth/.artifacts/**/results/
            explorers-earth/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Protected manual Apps qualification; no provider fetch or release gate is implied.
  apps-native:
    name: protected Apps manual qualification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'apps-native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            explorers-earth/package-lock.json
            tunes/package-lock.json
            tunes/auth-runtime/package-lock.json
      - name: Install locked qualification dependencies
        run: |
          npm ci
          npm ci --prefix explorers-earth
          npm ci --prefix tunes --legacy-peer-deps
          npm ci --prefix tunes/auth-runtime
      - name: Install owned Chromium
        working-directory: explorers-earth
        run: npx playwright install --with-deps chromium
      - name: Supply fixture PostgreSQL image
        run: docker pull postgres:15-alpine
      - name: Run protected Apps selection
        run: npm run platform:test:e2e -- --milestone delivered-auth-profile-books --ack TASK4_FIXTURE_OWNED_DISPOSABLE_PG15 --receipt "$RUNNER_TEMP/replatform-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-apps" --lane apps
        env:
          CI: true
          TMPDIR: ${{ runner.temp }}
      - name: Upload sanitized protected Apps evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apps-native-protected
          path: |
            ${{ runner.temp }}/replatform-e2e-${{ github.run_id }}-${{ github.run_attempt }}-apps/qualification.json
            ${{ runner.temp }}/replatform-e2e-${{ github.run_id }}-${{ github.run_attempt }}-apps/apps/receipt.json
            ${{ runner.temp }}/replatform-e2e-${{ github.run_id }}-${{ github.run_attempt }}-apps/apps/failure.json
          if-no-files-found: ignore
          retention-days: 14
