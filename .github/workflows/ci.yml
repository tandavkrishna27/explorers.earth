      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-music-account
          path: explorers-earth/test-results/
          if-no-files-found: ignore
          retention-days: 7

  replatform-required:
    name: replatform-required
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, typecheck, unit-tests, build, integration-tests, e2e-category-a, e2e-category-b, e2e-public-shell, e2e-publishing, e2e-music-account]
    steps:
      - name: Require each validation job to succeed
        working-directory: ${{ github.workspace }}
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e "const results=JSON.parse(process.env.REQUIRED_RESULTS); const failures=Object.entries(results).filter(([, job]) => job.result !== 'success'); if(failures.length){ console.error('Required validation did not succeed:', failures.map(([name, job]) => name + '=' + job.result).join(', ')); process.exit(1) }"
