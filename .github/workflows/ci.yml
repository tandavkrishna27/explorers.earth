          # Keep the public profile gateway inside the same deterministic
          # request fixture instead of falling back to an external authority.
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          # Full-stack Music authority suites belong to the provisioned qualification lanes.
          PLAYWRIGHT_PR_SAFE: true
          # Keep billing requests same-origin so the deterministic Playwright
          # fixture can intercept them instead of constructing /undefined URLs.
          VITE_PAYMENT_API_URL: http://localhost:5173


      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-public-shell-continuity
          path: .artifacts/public-shell-continuity/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-public-shell-continuity
          path: .artifacts/public-shell-continuity/results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-music-account:
    name: 🎭 E2E Music and account
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system packages are preinstalled, so the
    # lane no longer runs `playwright install --with-deps`, whose apt download from the hosted
    # mirror cost 5-16 minutes at random (WPCI, 2026-10-23). The tag must equal the locked
    # `playwright` version; scripts/ci-playwright-image.test.cjs pins that. --user 1001 is the
    # hosted runner's uid, so checkout and setup-node can write the mounted workspace.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Music fixture dependencies
        run: npm ci --prefix ../tunes --legacy-peer-deps
      - name: Install Playwright browsers
        # A no-op when the image tag matches the lockfile (the browsers are already in
        # PLAYWRIGHT_BROWSERS_PATH). It is kept so that a drift downloads the right browser
        # instead of failing obscurely.
        run: npx playwright install chromium
      - name: Run Playwright E2E tests
        # This lane passes no --config, so it inherits the root playwright.config.ts.
        # retries and the reporter are therefore set explicitly here: without them it
        # inherits CI retries=2 (tripling every failure's wall clock) and a line-only
        # reporter that produces no machine-readable result. The other E2E lanes
        # get both from their own --config; this keeps them consistent. The Music
        # specs this lane used to carry were removed with the Music product (P3-4);
        # the job keeps its key and name because platform-release-authority pins them.
        run: npx playwright test e2e/account-lifecycle.spec.ts --project=chromium-pr-safe --retries=0 --reporter=line,json
        env:
          CI: true
          # Must be written somewhere the upload step can actually find it; the
          # inherited line reporter never created the playwright-report/ directory
          # the upload previously pointed at, so this lane retained no evidence.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../.artifacts/music-account/report.json
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          # Empty by design: the contained public-page fixture uses its map
          # adapter and must never load the external Google Maps runtime.
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Fixtures mock the Local Tunes API (identity ensure, analytics) and keep
          # the integration enabled so those contained routes are exercised.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: https://localtunes.test
          # Keep the public profile gateway inside the same deterministic
          # request fixture instead of falling back to an external authority.
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          # Full-stack Music authority suites belong to the provisioned qualification lanes.
          PLAYWRIGHT_PR_SAFE: true
          # Keep billing requests same-origin so the deterministic Playwright
          # fixture can intercept them instead of constructing /undefined URLs.
          VITE_PAYMENT_API_URL: http://localhost:5173


      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-music-account
          path: .artifacts/music-account/report.json
          if-no-files-found: ignore
          retention-days: 7
      # always(), not failure(): this lane has been cancelled at the job timeout on
      # every recorded SHA, and a cancelled job never satisfies failure(), so the
      # traces for the slowest and least understood lane were discarded each time.
      - name: Upload screenshots/videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-failure-music-account
          path: explorers-earth/test-results/
          if-no-files-found: ignore
          retention-days: 7

  replatform-required:
    name: replatform-required
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, lint, typecheck, unit-tests, build, integration-tests, e2e-category-a, e2e-category-b, e2e-public-shell, e2e-music-account]
    steps:
      - name: Require each validation job to succeed
        working-directory: ${{ github.workspace }}
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        # Every job must conclude success. The only exception is a lane skipped on a
        # docs-only pull request, and only when `changes` itself succeeded and said so:
        # if the classifier fails or is cancelled, every dependent skips, `changes` is
        # not success, and this aggregate fails.
        run: |
          node -e "const results=JSON.parse(process.env.REQUIRED_RESULTS); const changes=results.changes||{}; const docsOnly=process.env.EVENT_NAME === 'pull_request' && changes.result === 'success' && !!changes.outputs && changes.outputs.docs_only === 'true'; const failures=Object.entries(results).filter(([name, job]) => docsOnly && job.result === 'skipped' && name !== 'changes' ? false : job.result !== 'success'); if(failures.length){ console.error('Required validation did not succeed:', failures.map(([name, job]) => name + '=' + job.result).join(', ')); process.exit(1) }"
