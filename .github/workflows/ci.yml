name: Explorers validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, codex/unified-replatform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: explorers-earth

jobs:
  # ─────────────────────────────────────────
  # Job 0: Classify the change set
  # ─────────────────────────────────────────
  # A pull request that changes only Markdown skips every lane below, but the
  # `replatform-required` aggregate still runs, still depends on every job, and still
  # decides the merge. scripts/ci-docs-only.cjs fails closed: every non-pull_request
  # event, every non-Markdown path and every doubt runs all lanes.
  changes:
    name: 🧭 Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Two commits: the PR merge commit and its base parent, which is what it diffs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Classify the change set
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-docs-only.cjs

  # ─────────────────────────────────────────
  # Job 1: ESLint Code Quality Check
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────
  # Job 2: TypeScript Type Safety Check
  # ─────────────────────────────────────────
  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        # Use `tsc -b` (not `--noEmit`): the root tsconfig.json is references-only
        # (`files: []`), and in non-build mode tsc ignores project references and
        # checks zero files — a false green. `-b` follows references and matches
        # the compile step in `npm run build`.
        run: npx tsc -b

  # ─────────────────────────────────────────
  # Job 3: Unit Tests with Coverage Report
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared fixture runtime dependencies
        # Discovery loads the same shared runtime schemas as the browser lanes.
        # Install their owning package before spawning Playwright's Node loader.
        run: npm ci --prefix ../tunes --legacy-peer-deps

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: explorers-earth/coverage/
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 3b: Production Build (parity with deploy)
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The platform build is what explorers.yml deploys; the legacy `npm run build` is
      # deployed by nothing and P6-8 deletes it (P6-5). The scanner's own test runs first,
      # because nothing else runs explorers-earth/scripts/*.test.mjs.
      - name: Build the platform SPA (what explorers.yml deploys)
        run: |
          node --test scripts/check-platform-bundle-strapi.test.mjs
          npm run landing:check
          npx tsc -b
          npx vite build --config vite.platform.config.ts --mode platform
          node scripts/check-music-production-bundle.mjs
          node scripts/check-platform-bundle-strapi.mjs dist

  # ─────────────────────────────────────────
  # Job 4: Integration Tests
  # ─────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, unit-tests]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --reporter=verbose
        env:
          CI: true

  # ─────────────────────────────────────────
  # Job 5: Playwright E2E Tests (headless)
  e2e-category-a:
    name: 🎭 E2E Category A
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system packages are preinstalled, so the
    # lane no longer runs `playwright install --with-deps`, whose apt download from the hosted
    # mirror cost 5-16 minutes at random (WPCI, 2026-10-23). The tag must equal the locked
    # `playwright` version; scripts/ci-playwright-image.test.cjs pins that. --user 1001 is the
    # hosted runner's uid, so checkout and setup-node can write the mounted workspace.
    container:
      image: mcr.microsoft.com/playwright:v0.0.0-noble
      options: --user 1001
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Music fixture dependencies
        run: npm ci --prefix ../tunes --legacy-peer-deps
      - name: Install Playwright browsers
        # A no-op when the image tag matches the lockfile (the browsers are already in
        # PLAYWRIGHT_BROWSERS_PATH). It is kept so that a drift downloads the right browser
        # instead of failing obscurely.
        run: npx playwright install chromium
      - name: Run Playwright E2E tests
        run: |
          npx playwright test --config=playwright.contained-auth-session.config.ts
          npx playwright test --config=playwright.category-navigation-a.config.ts
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          # Empty by design: the contained public-page fixture uses its map
          # adapter and must never load the external Google Maps runtime.
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Fixtures mock the Local Tunes API (identity ensure, analytics) and keep
          # the integration enabled so those contained routes are exercised.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: https://localtunes.test
          # Keep the public profile gateway inside the same deterministic
          # request fixture instead of falling back to an external authority.
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          # Full-stack Music authority suites belong to the provisioned qualification lanes.
          PLAYWRIGHT_PR_SAFE: true
          # Keep billing requests same-origin so the deterministic Playwright
          # fixture can intercept them instead of constructing /undefined URLs.
          VITE_PAYMENT_API_URL: http://localhost:5173


      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-category-navigation-a
          path: .artifacts/category-navigation-a/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-category-navigation-a
          path: .artifacts/category-navigation-a/results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-category-b:
    name: 🎭 E2E Category B
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system packages are preinstalled, so the
    # lane no longer runs `playwright install --with-deps`, whose apt download from the hosted
    # mirror cost 5-16 minutes at random (WPCI, 2026-10-23). The tag must equal the locked
    # `playwright` version; scripts/ci-playwright-image.test.cjs pins that. --user 1001 is the
    # hosted runner's uid, so checkout and setup-node can write the mounted workspace.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Music fixture dependencies
        run: npm ci --prefix ../tunes --legacy-peer-deps
      - name: Install Playwright browsers
        # A no-op when the image tag matches the lockfile (the browsers are already in
        # PLAYWRIGHT_BROWSERS_PATH). It is kept so that a drift downloads the right browser
        # instead of failing obscurely.
        run: npx playwright install chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --config=playwright.category-navigation-b.config.ts
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          # Empty by design: the contained public-page fixture uses its map
          # adapter and must never load the external Google Maps runtime.
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Fixtures mock the Local Tunes API (identity ensure, analytics) and keep
          # the integration enabled so those contained routes are exercised.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: https://localtunes.test
          # Keep the public profile gateway inside the same deterministic
          # request fixture instead of falling back to an external authority.
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          # Full-stack Music authority suites belong to the provisioned qualification lanes.
          PLAYWRIGHT_PR_SAFE: true
          # Keep billing requests same-origin so the deterministic Playwright
          # fixture can intercept them instead of constructing /undefined URLs.
          VITE_PAYMENT_API_URL: http://localhost:5173


      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-category-navigation-b
          path: .artifacts/category-navigation-b/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-category-navigation-b
          path: .artifacts/category-navigation-b/results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-public-shell:
    name: 🎭 E2E Public shell
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system packages are preinstalled, so the
    # lane no longer runs `playwright install --with-deps`, whose apt download from the hosted
    # mirror cost 5-16 minutes at random (WPCI, 2026-10-23). The tag must equal the locked
    # `playwright` version; scripts/ci-playwright-image.test.cjs pins that. --user 1001 is the
    # hosted runner's uid, so checkout and setup-node can write the mounted workspace.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Music fixture dependencies
        run: npm ci --prefix ../tunes --legacy-peer-deps
      - name: Install Playwright browsers
        # A no-op when the image tag matches the lockfile (the browsers are already in
        # PLAYWRIGHT_BROWSERS_PATH). It is kept so that a drift downloads the right browser
        # instead of failing obscurely.
        run: npx playwright install chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --config=playwright.public-shell-continuity.config.ts --project=chromium
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
