name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: explorers-earth

jobs:
  # ─────────────────────────────────────────
  # Job 1: ESLint Code Quality Check
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────
  # Job 2: TypeScript Type Safety Check
  # ─────────────────────────────────────────
  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        # Use `tsc -b` (not `--noEmit`): the root tsconfig.json is references-only
        # (`files: []`), and in non-build mode tsc ignores project references and
        # checks zero files — a false green. `-b` follows references and matches
        # the compile step in `npm run build`.
        run: npx tsc -b

  # ─────────────────────────────────────────
  # Job 3: Unit Tests with Coverage Report
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: explorers-earth/coverage/
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 3b: Production Build (parity with deploy)
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────
  # Job 4: Integration Tests
  # ─────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx vitest run --reporter=verbose integration
        env:
          CI: true

  # ─────────────────────────────────────────
  # Job 5: Playwright E2E Tests (headless)
  # ─────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          VITE_GOOGLE_MAPS_API_KEY: test-key
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Music flow (music.spec.ts) mocks the Local Tunes API and needs the
          # integration enabled or the playlist UI never renders.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: explorers-earth/playwright-report/
          retention-days: 7

      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: explorers-earth/test-results/
          retention-days: 7
